[workspace]
resolver = "3"
members = [
  "crates/agent-core", "crates/ai-protocol", 'crates/ai', "crates/change-tracker", "crates/cli", "crates/coding-agent", "crates/code-intelligence", "crates/desktop", "crates/event-journal", "crates/extension-host", "crates/observability", "crates/release-updater", "crates/scenario-testing", "crates/tool-contract", "crates/tool-runtime", "crates/tui", "crates/workspace-runtime",
]
# The vendored `gpui-component` checkout carries its own workspace; leave it to
# resolve against that one rather than inheriting this manifest's settings.
exclude = ["third-party"]

[workspace.package]
version = "0.7.2"
edition = "2024"
rust-version = "1.96"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
agent-core = { path = "crates/agent-core" }
ai = { path = "crates/ai" }
ai-protocol = { path = "crates/ai-protocol" }
coding-agent = { path = "crates/coding-agent" }
code-intelligence = { path = "crates/code-intelligence" }
change-tracker = { path = "crates/change-tracker" }
event-journal = { path = "crates/event-journal" }
extension-host = { path = "crates/extension-host" }
observability = { path = "crates/observability" }
release-updater = { path = "crates/release-updater" }
scenario-testing = { path = "crates/scenario-testing" }
tool-contract = { path = "crates/tool-contract" }
tool-runtime = { path = "crates/tool-runtime" }
workspace-runtime = { path = "crates/workspace-runtime" }
tui = { path = "crates/tui" }
async-stream = "0.3"
base64 = "0.22"
futures = "0.3"
htmd = "0.5.5"
ignore = "0.4"
libc = "0.2"
petgraph = "0.6.5"
rayon = "1.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = "1"
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
tree-sitter = "0.25.10"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.0"
tree-sitter-typescript = "0.23.2"
uuid = "1"

# Build `gpui-component` from a locally vendored checkout of the pinned upstream
# revision plus the patches in `patches/gpui-component/`. The dependency
# declarations in `crates/desktop/Cargo.toml` keep the upstream git + rev so the
# base revision stays recorded and reviewable; this only redirects where the
# source is read from. Run `scripts/vendor-gpui-component.sh` to recreate the
# tree, which is deliberately untracked.
[patch."https://github.com/longbridge/gpui-component.git"]
gpui-component = { path = "third-party/gpui-component/crates/ui" }
gpui-component-assets = { path = "third-party/gpui-component/crates/assets" }
