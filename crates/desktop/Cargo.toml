[package]
name = "desktop"
version.workspace = true
edition = "2024"

[dependencies]
gpui-component = { version = "=0.5.1", default-features = false }
coding-agent = { path = "../coding-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "test-util", "time"] }
toml = "0.8"
