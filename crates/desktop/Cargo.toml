[package]
name = "desktop"
version.workspace = true
edition = "2024"

[dependencies]
gpui-component = { git = "https://github.com/longbridge/gpui-component.git", rev = "bc174a7ec4534b2a4174fddde314b38d30d69093", default-features = false }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component.git", rev = "bc174a7ec4534b2a4174fddde314b38d30d69093" }
coding-agent = { path = "../coding-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tracing = "0.1"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", default-features = false, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", default-features = false, features = ["font-kit"] }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", default-features = false, features = ["font-kit"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", default-features = false, features = ["windows-manifest"] }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", default-features = false, features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "test-util", "time"] }
toml = "0.8"
