[package]
name = "coding-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"

[features]
default = []

[dependencies]
base64.workspace = true
cap-std = "4.0.2"
dirs = "6"
event-journal.workspace = true
futures.workspace = true
globset = "0.4"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc.workspace = true
notify = "7"
agent-core.workspace = true
ai.workspace = true
ai-protocol.workspace = true
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = "0.10"
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "process", "time", "io-util", "io-std", "sync", "signal", "test-util"] }
tokio-util.workspace = true
toml.workspace = true
tool-contract.workspace = true
tool-runtime.workspace = true
workspace-runtime.workspace = true
unicode-normalization = "0.1"

[dev-dependencies]
async-stream.workspace = true
agent-core = { workspace = true, features = ["test-support"] }
ai = { workspace = true, features = ["test-support"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
junction = { version = "2.0.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
