[package]
name = "cli"
version.workspace = true
edition = "2024"
publish = false

[features]
default = []

[dependencies]
libc = "0.2"
coding-agent = { path = "../coding-agent" }
tui = { path = "../tui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "io-util", "io-std", "sync", "signal"] }
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
base64 = "0.22"
tui = { path = "../tui", features = ["test-support"] }
tempfile = "3"

[[bin]]
name = "coding-agent"
path = "src/main.rs"
