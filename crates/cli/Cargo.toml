[package]
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []

[dependencies]
libc.workspace = true
coding-agent.workspace = true
tui.workspace = true
serde.workspace = true
serde_json.workspace = true
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "process", "time", "io-util", "io-std", "sync", "signal"] }
time = { workspace = true, features = ["formatting"] }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
base64.workspace = true
tui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
syn.workspace = true

[[bin]]
name = "coding-agent"
path = "src/main.rs"
