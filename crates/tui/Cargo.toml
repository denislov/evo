[package]
name = "tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
test-support = []

[dependencies]
base64.workspace = true
bitflags = "2"
crossterm = "0.28"
pulldown-cmark = "0.12"
thiserror.workspace = true
unicode-segmentation = "1"
unicode-width = "0.2"

[[test]]
name = "api_contract"
required-features = ["test-support"]

[[test]]
name = "components"
required-features = ["test-support"]

[[test]]
name = "render"
required-features = ["test-support"]

[[test]]
name = "terminal"
required-features = ["test-support"]

[[test]]
name = "markdown_image"
required-features = ["test-support"]
